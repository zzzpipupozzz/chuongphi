<title id="logo-title">Chương Phi — Be Vietnam Pro</title>
<desc id="logo-desc">Bản xem trước: gọt thân theo hình tham chiếu; cạnh phải thẳng lên đỉnh nhọn, cạnh trái cong vào thân. Giữ phần bông lúa và font Be Vietnam Pro. Không thay đổi logo trên website.</desc>
